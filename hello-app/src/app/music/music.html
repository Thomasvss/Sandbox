<div class="carousels">
  <app-carousel class="genre-rap" heading="Rap / Hip-Hop" [albums]="rapAlbums" />
  <app-carousel class="genre-pop" heading="Pop" [albums]="popAlbums" />
  <app-carousel class="genre-rock" heading="Rock" [albums]="rockAlbums" />
  <app-carousel class="genre-country" heading="Country" [albums]="countryAlbums" />
</div>

<p class="source-note">
  Units are estimates from <a href="https://chartmasters.org">ChartMasters</a> (updated 25 September
  2026). They combine album sales, singles and streams, so they aren't copies sold.
</p>
